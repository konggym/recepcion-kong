:root{
  --bg:#070f22; --bg2:rgba(14,27,58,.58); --card:rgba(19,36,74,.56); --card2:rgba(27,48,92,.62); --line:rgba(255,230,195,.18);
  --text:#fbf1de; --muted:#9eaed0; --leaf:#ffb22e; --leaf2:#d9841a; --gold:#ffd27a; --danger:#ff7a5c; --ok:#5fd38a;
  --ink:#0a1428; --glow:rgba(255,170,40,.55); --glow-soft:rgba(255,170,40,.18);
  --display:'Luckiest Guy',system-ui,sans-serif;
  --r:22px;
  --glass-blur:24px; --glass-sat:180%; --glass-hi:rgba(255,255,255,.4); --glass-lo:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
.card,.hero,.stat,.sheet,.top,.tabs,.chip,.pill,.seg,select,.btn.ghost,.qa,.prod,.kp button,.search{
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}
.card,.hero{position:relative;overflow:hidden}
.card::before,.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.05) 20%,transparent 42%);pointer-events:none;mix-blend-mode:screen}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(700px 380px at 50% -120px, rgba(255,170,40,.28), transparent 70%),
    radial-gradient(600px 500px at 110% 60%, rgba(40,80,170,.34), transparent 70%),
    radial-gradient(500px 400px at -20% 100%, rgba(255,150,30,.14), transparent 70%),
    radial-gradient(520px 420px at 30% 40%, rgba(120,170,255,.10), transparent 70%),
    var(--bg);
  background-attachment:fixed,fixed,fixed,fixed,fixed;}
*{-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,label{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;user-select:none;-webkit-user-select:none}
a{color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
input:focus,select:focus,textarea:focus{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(255,178,46,.15),0 0 18px -4px var(--glow)}
input[type=date]{min-height:46px}
select option{background:#0e1b3a;color:var(--text)}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5;background:rgba(7,15,34,.42);border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 14px 30px -22px var(--glow)}
main{padding-top:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;flex:none;border-radius:13px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1d3670,#0c1834);box-shadow:0 0 0 1px rgba(255,178,46,.55),0 0 26px rgba(255,170,40,.45)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.bt{font-family:var(--display);font-size:20px;letter-spacing:.06em;line-height:1;color:var(--gold);text-shadow:0 0 18px var(--glow)}
.bs{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.chip{font-size:13px;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip.warn{border-color:rgba(255,122,92,.5);color:var(--danger)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-shadow:0 0 28px var(--glow-soft)}
h1{font-size:clamp(23px,7vw,28px);line-height:1.12}
h2{font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--ink);background:var(--leaf);border-radius:99px;padding:1px 8px;text-shadow:none}
h3{font-size:18px;line-height:1.2}
.muted{color:var(--muted)}.small{font-size:13px}.gold{color:var(--gold)}.red{color:var(--danger)}.green{color:var(--ok)}
.card{background:radial-gradient(130% 70% at 50% -30%,rgba(255,178,46,.14),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.09),transparent 45%),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-lo),0 20px 40px -26px var(--glow),0 2px 0 rgba(0,0,0,.25),0 1px 24px -4px rgba(0,0,0,.3)}
.card.flush{padding:4px 0}
.hero{background:radial-gradient(90% 75% at 88% -5%,rgba(255,178,46,.4),transparent 62%),radial-gradient(60% 60% at 0% 110%,rgba(255,140,20,.14),transparent 70%),linear-gradient(165deg,rgba(24,48,106,.72),rgba(12,24,52,.72) 70%);padding:20px;border:1px solid rgba(255,220,180,.26);border-radius:var(--r);margin-bottom:12px;box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-lo),0 26px 50px -24px var(--glow),0 1px 24px -4px rgba(0,0,0,.3)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;text-shadow:0 0 14px var(--glow-soft)}
.big{font-family:var(--display);font-size:36px;color:var(--gold);text-shadow:0 0 22px var(--glow-soft);line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{background:radial-gradient(120% 80% at 50% -40%,rgba(255,178,46,.12),transparent 65%),var(--card);box-shadow:inset 0 1px 0 rgba(255,214,140,.07);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:block;width:100%}
.stat b{display:block;font-family:var(--display);font-size:26px;color:var(--gold);text-shadow:0 0 18px var(--glow-soft);font-weight:400;line-height:1.1}
.stat.r b{color:var(--danger)}.stat.g b{color:var(--ok)}
.stat span{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:13px;border-radius:14px;font-weight:700;background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);font-size:16px;box-shadow:inset 0 1px 0 rgba(255,240,200,.6),0 12px 30px -10px var(--glow),0 0 0 1px rgba(255,200,110,.35);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.wa{background:linear-gradient(160deg,#4be38a,#1fae55);color:#06240f;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -10px rgba(37,211,102,.7)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,122,92,.4);box-shadow:none}
.btn.sm{min-height:42px;padding:8px 12px;font-size:14px;width:auto;border-radius:12px}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1}.row .btn+.btn{margin-top:0}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px 0;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{padding:10px 14px;min-height:42px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px}
.pill.on{background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);border-color:var(--leaf);font-weight:700;box-shadow:0 6px 18px -6px var(--glow)}
.pill i{font-style:normal;opacity:.75;margin-left:4px}
.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);box-shadow:0 6px 18px -8px var(--glow)}
.seg.f{margin-bottom:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(7,15,34,.58);box-shadow:0 -14px 30px -20px var(--glow),inset 0 1px 0 var(--glass-hi);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);min-height:52px;position:relative}
.tab .ti{font-size:21px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--leaf);text-shadow:0 0 12px var(--glow)}
.tab.on .ti{filter:drop-shadow(0 0 8px var(--glow));opacity:1}
.tab .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);min-height:62px}
.li:last-child{border-bottom:0}
button.li:active,.li.tap:active{background:rgba(255,255,255,.05)}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.av{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--gold);background:rgba(255,178,46,.12);border:1px solid rgba(255,178,46,.3)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.b-ok{background:rgba(95,211,138,.14);color:var(--ok);border-color:rgba(95,211,138,.35)}
.b-warn{background:rgba(255,210,122,.14);color:var(--gold);border-color:rgba(255,210,122,.4)}
.b-bad{background:rgba(255,122,92,.14);color:var(--danger);border-color:rgba(255,122,92,.4)}
.b-mute{background:rgba(158,174,208,.12);color:var(--muted);border-color:rgba(158,174,208,.3)}
.money{font-family:var(--display);font-size:17px;color:var(--gold);white-space:nowrap}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:76px;padding:8px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.qa span{font-size:23px}
.qa:active{transform:scale(.97)}
.search{position:relative;margin-bottom:12px;border-radius:14px}
.search input{padding-left:40px;min-height:50px;background:var(--card)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7;pointer-events:none}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f-row{display:flex;gap:10px}.f-row>label{flex:1}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,10,24,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal.hidden{display:none}
.sheet{background:radial-gradient(110% 60% at 50% -10%,rgba(255,178,46,.16),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.07),transparent 30%),var(--card2);border:1px solid var(--line);border-radius:26px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:90vh;overflow:auto;animation:up .25s ease;box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 50px -10px var(--glow);-webkit-overflow-scrolling:touch}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.x{width:42px;height:42px;flex:none;border-radius:12px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font-size:16px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--gold);color:var(--ink);box-shadow:0 10px 30px -8px var(--glow);font-weight:700;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:92vw;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--danger);color:#fff}
.note{font-size:13px;color:var(--muted);background:rgba(255,255,255,.05);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.note.warn{color:var(--gold);border-color:rgba(255,210,122,.45)}
.empty{text-align:center;color:var(--muted);padding:18px 12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:6px 0 14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:700;word-break:break-word}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:12px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--leaf),var(--leaf2));box-shadow:0 0 12px -2px var(--glow);min-height:2px}
.bars i.zero{background:rgba(255,255,255,.08);box-shadow:none}
.bars i.cur{background:linear-gradient(180deg,#ffe1a0,var(--gold))}
.bars small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.mbar{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:14px}
.mbar>span{width:104px;flex:none}
.mbar .tr{flex:1;height:9px;border-radius:9px;background:rgba(0,0,0,.28);overflow:hidden}
.mbar .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--leaf2),var(--leaf))}
.mbar b{width:74px;text-align:right;flex:none}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.prod{border-radius:16px;padding:12px 10px;background:var(--card);border:1px solid var(--line);text-align:left;min-height:84px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.prod b{font-size:14.5px;line-height:1.2}
.prod .money{font-size:16px}
.prod small{font-size:11.5px;color:var(--muted)}
.prod.on{background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);border-color:var(--leaf);box-shadow:0 8px 22px -8px var(--glow)}
.prod.on .money,.prod.on small{color:var(--ink)}
.prod.out{opacity:.55}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stepper button{width:54px;height:50px;font-size:24px;color:var(--leaf)}
.stepper b{font-family:var(--display);font-size:24px;color:var(--gold);font-weight:400}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);min-height:58px}
.pick.empty-pick{color:var(--muted)}
.pick .ch{margin-left:auto;color:var(--leaf);font-weight:700;font-size:14px}
.total-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.sent{opacity:.55}
.inline-ok{color:var(--ok);font-weight:700;font-size:13px}
/* Entrada con PIN */
.login{padding-top:calc(24px + env(safe-area-inset-top));text-align:center;max-width:380px;margin:0 auto}
.logo-hero{position:relative;max-width:230px;margin:0 auto 4px}
.logo-hero::before{content:"";position:absolute;inset:8% 10%;background:radial-gradient(closest-side,rgba(255,170,40,.45),transparent);filter:blur(28px)}
.logo-hero img{position:relative;width:100%;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0 8px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--leaf);transition:.15s}
.dots i.on{background:var(--leaf);box-shadow:0 0 12px var(--glow)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px auto 0;max-width:300px}
.kp button{height:64px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:26px;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.kp button:active{background:rgba(255,178,46,.25)}
.kp button.fn{font-size:15px;color:var(--muted)}
.msg{min-height:22px;font-size:14px;color:var(--danger)}
@media (max-width:360px){
  #app{padding-left:12px;padding-right:12px}
  .top{margin:0 -12px;padding-left:12px;padding-right:12px}
  .bt{font-size:17px}.bs{font-size:10.5px}
  .stats{gap:7px}.stat b{font-size:22px}
  .qa-grid{gap:6px}.qa{font-size:11.5px}
  .card{padding:14px}
  .mbar>span{width:88px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===================== UTILIDADES ===================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-MX');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const isOwner = () => S.rol === 'dueno';
function dmyToYmd(s) { const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : ''; }
function ymdNice(ymd, year) {
  const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return ymd || '—';
  return `${Number(m[3])} ${MES[Number(m[2]) - 1]}${year ? ' ' + m[1] : ''}`;
}
const dmyNice = (s, y) => (dmyToYmd(s) ? ymdNice(dmyToYmd(s), y) : (s || '—'));
function ymdAdd(ymd, days) { const d = new Date(ymd + 'T12:00:00'); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
const hoy = () => (S.d && S.d.hoy) || new Date().toISOString().slice(0, 10);
function dayLabel(ymd) {
  if (ymd === hoy()) return 'Hoy';
  if (ymd === ymdAdd(hoy(), -1)) return 'Ayer';
  const d = new Date(ymd + 'T12:00:00');
  return `${DIAS[d.getDay()][0].toUpperCase() + DIAS[d.getDay()].slice(1)} ${ymdNice(ymd)}`;
}
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const initial = n => (String(n || '?').trim()[0] || '?').toUpperCase();
function badge(estado) {
  const c = { 'Al corriente': 'b-ok', 'Por vencer': 'b-warn', 'Vence hoy': 'b-warn', 'Vencido': 'b-bad', 'Sin pagos': 'b-mute', 'Baja': 'b-mute' }[estado] || 'b-mute';
  return `<span class="badge ${c}">${esc(estado || '—')}</span>`;
}
function waLink(numero, msg) { const n = String(numero || '').replace(/\D/g, '').slice(-10); return n.length === 10 ? `https://wa.me/52${n}?text=${encodeURIComponent(msg)}` : ''; }
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), err ? 4200 : 2600);
}
const socios = () => (S.d && S.d.socios) || [];

const sentKey = () => 'd' + hoy();
function isSent(k) { return !!(S.sent[sentKey()] || {})[k]; }
function markSent(k) {

  asistencia_fila: 'La fila de Asistencias no coincide con el socio; revisa el Sheet.', no_coincide: 'Los datos cambiaron en el Sheet; actualiza e intenta de nuevo.',
  red: 'Sin conexión. Revisa tu internet e intenta de nuevo.', servidor: 'Hubo un error en el Sheet.'
};
const CAMPOS = { nombre: 'el nombre', wa: 'un WhatsApp de 10 dígitos', membresia: 'la membresía', plan: 'el plan', periodo: 'el periodo', monto: 'el monto', metodo: 'el método de pago', producto: 'el producto', cantidad: 'la cantidad', piezas: 'las piezas', precio: 'el precio', hora: 'la hora' };
function errText(r) {
  if (!r) return ERR.red;
  if (r.error === 'falta') return 'Revisa ' + (CAMPOS[r.campo] || 'los datos');
  if (r.error === 'pin' && r.restantes !== undefined) return `PIN incorrecto · te quedan ${r.restantes} intentos`;
  return ERR[r.error] || ('Error: ' + (r.detalle || r.error));
}
async function api(accion, extra = {}, pin = S.pin) {
  if (DEMO) return demoApi(accion, extra, pin);
  if (!API_URL) return { ok: false, error: 'sin_api' };
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ accion, pin }, extra)), redirect: 'follow' });
    return await res.json();
  } catch (e) { return { ok: false, error: 'red' }; }
}
function setDatos(d) {
  S.d = d; S.at = Date.now(); S.offline = false;
  ls.set('datos', d); ls.set('at', S.at);
}
async function refresh(silent) {
  if (S.loading) return;
  S.loading = true; renderTop();
  const r = await api('datos');
  S.loading = false;
  if (r && r.ok) { setDatos(r); if (r.rol !== S.rol) { S.rol = r.rol; ls.set('rol', r.rol); } }
  else if (r && (r.error === 'pin' || r.error === 'bloqueado')) { logout(); toast('Tu PIN cambió; vuelve a entrar', true); return; }
  else { S.offline = true; if (!silent) toast(errText(r), true); }
  render();
}
/* Envía un cambio; el Sheet responde con los datos ya recalculados */
async function send(accion, extra, okMsg) {
  if (S.busy) return null;
  S.busy = true; $$('.sheet .btn[data-save]').forEach(b => { b.disabled = true; b.dataset.t = b.innerHTML; b.innerHTML = '<span class="spin">⏳</span> Guardando…'; });
  const r = await api(accion, extra);
  S.busy = false;
  $$('.sheet .btn[data-save]').forEach(b => { b.disabled = false; if (b.dataset.t) b.innerHTML = b.dataset.t; });
  if (!r || !r.ok) { toast(errText(r), true); return null; }
  if (r.datos) setDatos(r.datos);
  if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
  render();
  return r;
}

function pinDots() { $$('#dots i').forEach((i, k) => i.classList.toggle('on', k < pinBuf.length)); }
async function pinKey(k) {
  if (S.loading) return;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (k === 'clr') pinBuf = '';
  else if (pinBuf.length < 6) pinBuf += k;
  pinDots();
  if (pinBuf.length === 6) {
    S.loading = true; $('#pmsg').innerHTML = '<span class="muted"><span class="spin">⏳</span> Entrando…</span>';
    const r = await api('datos', {}, pinBuf);
    S.loading = false;
    if (r && r.ok) {
      S.pin = pinBuf; S.rol = r.rol; ls.set('pin', S.pin); ls.set('rol', S.rol); setDatos(r); pinBuf = '';
      location.hash = '#inicio'; render();
    } else {
      pinBuf = ''; pinDots(); $('#dots').classList.add('shake'); setTimeout(() => { const d = $('#dots'); d && d.classList.remove('shake'); }, 400);
      $('#pmsg').textContent = r && r.error === 'sin_api' ? 'Falta pegar la URL del Apps Script en la app.' : errText(r);
    }
  }
}
document.addEventListener('keydown', e => {

}

  const ins = dmyToYmd(s.inscripcion) || (nuevo ? hoy() : '');

    <label class="f"><span>Nombre completo *</span><input id="fn" value="${esc(s.nombre)}" autocomplete="off" autocapitalize="words"></label>

    <div class="f-row"><label class="f"><span>Plan</span><select id="fp">${d.planes.map(x => `<option ${x === s.plan ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>

    ${!nuevo && isOwner() ? `<label class="f"><span>Activo</span><div class="seg f" id="fa">${['Sí', 'No'].map(x => `<button type="button" data-v="${x}" class="${(s.activo || 'Sí') === x ? 'on' : ''}">${x === 'No' ? 'No (baja)' : 'Sí'}</button>`).join('')}</div></label>` : ''}

      const r = await send('socio_guardar', { socio: body }, r => nuevo ? `Socio ${r.id} registrado 🦍` : 'Datos guardados');

/* ===================== COBROS ===================== */
function pagoLi(p) {
  const dif = p.lista && p.monto !== p.lista;
  return `<div class="li"><div class="av" style="font-family:inherit">💵</div><div class="mid"><div class="t">${esc(p.nombre || p.socio)}</div>
    <div class="s">${esc(p.periodo)} · ${esc(p.metodo)}${p.vence ? ' · vence ' + esc(ymdNice(p.vence)) : ''}</div>${dif ? `<div class="s gold">Lista ${money(p.lista)} — distinto al cobrado</div>` : ''}</div>
    <div class="end"><span class="money">${money(p.monto)}</span><span class="muted small">${esc(dayLabel(p.fecha))}</span></div></div>`;
}
function renderCobros(m) {
  const mode = S.ui.cobMode;
  let h = `<h1 style="margin-bottom:12px">Cobros</h1>
    <div class="seg"><button data-m="rec" class="${mode === 'rec' ? 'on' : ''}">📲 Recordatorios</button><button data-m="pagos" class="${mode === 'pagos' ? 'on' : ''}">💵 Pagos</button></div>`;
  if (mode === 'rec') {
    const pv = socios().filter(s => s.estado === 'Por vencer' || s.estado === 'Vence hoy').sort((a, b) => a.dias - b.dias);
    const ve = socios().filter(s => s.estado === 'Vencido').sort((a, b) => b.dias - a.dias);
    const gv = socios().filter(s => s.graciasVisita), gn = socios().filter(s => s.graciasNuevo);
    const item = (s, url, key, sub, end) => {
      const sent = isSent(key);
      return `<div class="li ${sent ? 'sent' : ''}"><div class="av">${esc(initial(s.nombre))}</div><div class="mid tap" data-f="${s.fila}" style="cursor:pointer"><div class="t">${esc(s.nombre)}</div><div class="s">${sub}</div></div>
        <div class="end">${url ? `<a class="btn sm wa" href="${esc(url)}" target="_blank" rel="noopener" data-k="${key}">${sent ? '✓ Enviado' : '📲 Enviar'}</a>` : `<button class="btn sm ghost" data-ed="${s.fila}">Falta WhatsApp</button>`}${end || ''}</div></div>`;
    };
    h += `<p class="muted small" style="margin-bottom:6px">Toca «Enviar»: se abre WhatsApp con el mensaje listo, solo presiona enviar.</p>
      <h2>Por vencer / vencen hoy <span class="n">${pv.length}</span></h2>
      <div class="card flush">${pv.length ? pv.map(s => item(s, s.url, 'r' + s.id, `${s.estado === 'Vence hoy' ? '<b class="gold">Vence hoy</b>' : 'Vence ' + esc(dmyNice(s.vence))} · ${money(s.monto)}`)).join('') : '<div class="empty">Nadie por vencer 🎉</div>'}</div>
      <h2>Vencidos <span class="n">${ve.length}</span></h2>
      <div class="card flush">${ve.length ? ve.map(s => item(s, s.url, 'v' + s.id, `Venció ${esc(dmyNice(s.vence))} · hace ${Math.abs(s.dias)} día${Math.abs(s.dias) === 1 ? '' : 's'}`)).join('') : '<div class="empty">Sin vencidos</div>'}</div>
      <h2>Agradecimientos de hoy</h2>
      <p class="muted small" style="margin:-4px 0 8px">Envíalos hacia las ${esc(S.d.horaGracias)}.</p>
      <div class="card flush">${gv.length + gn.length ? gn.map(s => item(s, s.urlNuevo, 'n' + s.id, `Socio nuevo · ${esc(s.membresia)}`)).join('') + gv.map(s => item(s, s.urlVisita, 'g' + s.id, 'Visita de hoy')).join('') : '<div class="empty">Hoy no hay visitas ni socios nuevos</div>'}</div>`;
  } else {
    const mesK = hoy().slice(0, 7);
    const delMes = S.d.pagos.filter(p => p.fecha.slice(0, 7) === mesK);
    const lista = S.d.pagos.slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || b.fila - a.fila).slice(0, 60);
    h += `<button class="btn" id="np">+ Registrar pago</button>
      <div class="stats ${isOwner() ? 'two' : ''}" style="margin-top:12px;${isOwner() ? '' : 'grid-template-columns:1fr'}">
        <div class="stat"><b>${delMes.length}</b><span>Pagos en ${MESL[Number(mesK.slice(5)) - 1]}</span></div>
        ${isOwner() ? `<div class="stat"><b>${money(delMes.reduce((a, p) => a + p.monto, 0))}</b><span>Cobrado en el mes</span></div>` : ''}
      </div>
      <h2>Últimos pagos</h2><div class="card flush">${lista.length ? lista.map(pagoLi).join('') : '<div class="empty">Aún no hay pagos</div>'}</div>`;
  }
  m.innerHTML = h;
  $$('.seg button', m).forEach(b => b.onclick = () => { S.ui.cobMode = b.dataset.m; renderCobros(m); });
  $$('a[data-k]', m).forEach(a => a.addEventListener('click', () => { markSent(a.dataset.k); setTimeout(() => render(), 300); }));
  $$('[data-ed]', m).forEach(b => b.onclick = () => openSocioForm(socioBy(b.dataset.ed)));
  $$('.mid.tap', m).forEach(b => b.onclick = () => openSocio(b.dataset.f));
  const np = $('#np'); if (np) np.onclick = () => openPago();
}
function openPago(pre) {
  const st = { s: pre || null, periodo: (pre && S.d.planes.includes(pre.plan)) ? pre.plan : 'Mensual', metodo: 'Efectivo', monto: '', fecha: hoy(), notas: '', manual: false };
  const precio = () => (st.s && S.d.tarifas[st.s.membresia] && S.d.tarifas[st.s.membresia][st.periodo]) || 0;
  const draw = () => {
    if (!st.manual) st.monto = st.s ? String(precio()) : '';
    openSheet(`${sheetHead('Registrar pago')}
      <label class="f"><span>Socio</span>${pickBtn(st.s)}</label>
      <label class="f"><span>Periodo</span><div class="pills" style="margin:0 -18px 0 0;padding-right:18px">${S.d.planes.map(p => `<button type="button" class="pill ${p === st.periodo ? 'on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div></label>
      <div class="f-row"><label class="f"><span>Monto cobrado</span><input id="pm" inputmode="decimal" value="${esc(st.monto)}"></label>
      <label class="f"><span>Fecha de pago</span><input type="date" id="pf" value="${esc(st.fecha)}" max="${hoy()}"></label></div>
      <div id="pdif"></div>
      <label class="f"><span>Método</span><div class="seg f" id="pmet">${METODOS.map(x => `<button type="button" data-v="${x}" class="${x === st.metodo ? 'on' : ''}">${x}</button>`).join('')}</div></label>
      <label class="f"><span>Notas (opcional)</span><input id="pn" value="${esc(st.notas)}"></label>
      <div class="total-row"><span class="muted">Total a cobrar</span><span class="big" style="font-size:30px" id="ptot">${money(st.monto)}</span></div>
      <button class="btn" data-save id="psave">Registrar pago</button>`, () => {
      const dif = () => {
        const v = Number($('#pm').value), l = precio();
        $('#pdif').innerHTML = st.s && l && v !== l ? `<div class="note warn">El precio de lista es ${money(l)}. En el Sheet se marcará en naranja (descuento, abono o error).</div>` : '';
        $('#ptot').textContent = money(v);
      };
      $('#pick').onclick = () => pickSocio(s => { st.s = s; st.manual = false; if (S.d.planes.includes(s.plan)) st.periodo = s.plan; draw(); });
      $$('[data-p]').forEach(b => b.onclick = () => { st.periodo = b.dataset.p; st.manual = false; keep(); draw(); });
      $$('#pmet button').forEach(b => b.onclick = () => { st.metodo = b.dataset.v; $$('#pmet button').forEach(x => x.classList.toggle('on', x === b)); });
      const keep = () => { st.fecha = $('#pf').value || hoy(); st.notas = $('#pn').value; };
      $('#pm').oninput = () => { st.manual = true; st.monto = $('#pm').value; dif(); };
      dif();
      $('#psave').onclick = async () => {
        keep();
        if (!st.s) return toast('Elige al socio', true);
        const monto = Number(String($('#pm').value).replace(/[^\d.]/g, ''));
        if (!(monto >= 0) || $('#pm').value === '') return toast('Escribe el monto', true);
        const r = await send('pago', { pago: { fila: st.s.fila, id: st.s.id, periodo: st.periodo, monto, metodo: st.metodo, fecha: st.fecha, notas: st.notas } },
          r => `Pago registrado${r.vence ? ' · vence ' + ymdNice(r.vence) : ''} ✅`);
        if (r) closeSheet();
      };
    });
  };
  draw();
}

/* ===================== ASISTENCIA ===================== */
async function registrarEntrada(s, fromSheet) {
  const r = await send('asistencia', { fila: s.fila, id: s.id }, r => r.ya ? `${firstName(s.nombre)} ya había entrado a las ${r.hora}` : `Entrada de ${firstName(s.nombre)} · ${r.hora} ✅`);
  if (r && fromSheet) openSocio(s.fila);
  if (r && !fromSheet) { S.ui.asisQ = ''; render(); const q = $('#aq'); if (q) q.focus(); }
  if (r && s.estado === 'Vencido') setTimeout(() => toast(`Ojo: la membresía de ${firstName(s.nombre)} está vencida`, true), 2700);
}
function renderAsistencia(m) {
  const A = S.d.asistencia;
  const hoyList = socios().filter(s => asisOf(s).hoy).sort((a, b) => asisOf(b).hoy.localeCompare(asisOf(a).hoy, undefined, { numeric: true }));
  const faltan = socios().filter(s => asisOf(s).aviso && s.estado !== 'Baja').sort((a, b) => (asisOf(b).sinVenir || 0) - (asisOf(a).sinVenir || 0));
  const mesNuevo = A.mes && A.mes !== A.mesActual;
  const dias = A.porDia.filter(v => v !== null), max = Math.max(1, ...dias);
  const diaHoy = Number(hoy().slice(8));
  m.innerHTML = `<h1 style="margin-bottom:12px">Asistencia</h1>
    ${mesNuevo ? `<div class="note warn">Empezó un mes nuevo. Con la primera entrada que registres, la app guarda ${MESL[Number(A.mes.slice(5)) - 1]} como respaldo en otra pestaña y deja «Asistencias» lista para ${MESL[Number(A.mesActual.slice(5)) - 1]}.</div>` : ''}
    <div class="search"><input id="aq" placeholder="Registrar entrada: nombre o ID" value="${esc(S.ui.asisQ)}" autocomplete="off"></div>
    <div class="card flush" id="ares" style="display:none"></div>
    <h2>Hoy <span class="n">${hoyList.length}</span></h2>
    <div class="card flush">${hoyList.length ? hoyList.map(s => `<div class="li"><div class="av">${esc(initial(s.nombre))}</div><div class="mid tap" data-f="${s.fila}"><div class="t">${esc(s.nombre)}</div><div class="s">${esc(s.id)} · ${badge(s.estado)}</div></div><div class="end"><b class="gold">${esc(asisOf(s).hoy)}</b><button class="small muted" data-del="${s.fila}" style="padding:4px 0">Quitar</button></div></div>`).join('') : '<div class="empty">Aún no hay entradas hoy</div>'}</div>
    <h2>Más de ${A.umbral} días sin venir <span class="n">${faltan.length}</span></h2>
    <div class="card flush">${faltan.length ? faltan.map(s => {
      const url = waLink(s.wa, MSG_EXTRANAMOS.replace('{nombre}', firstName(s.nombre))), key = 'x' + s.id, sent = isSent(key);
      return `<div class="li ${sent ? 'sent' : ''}"><div class="av">${esc(initial(s.nombre))}</div><div class="mid tap" data-f="${s.fila}"><div class="t">${esc(s.nombre)}</div><div class="s">${esc(asisOf(s).aviso.replace('⚠ ', ''))}${asisOf(s).ultima ? ' · última ' + esc(dmyNice(asisOf(s).ultima)) : ''}</div></div>
      <div class="end">${url ? `<a class="btn sm wa" href="${esc(url)}" target="_blank" rel="noopener" data-k="${key}">${sent ? '✓ Enviado' : '💬 Escribir'}</a>` : '<span class="muted small">Sin WhatsApp</span>'}</div></div>`;
    }).join('') : '<div class="empty">Todos han venido 💪</div>'}</div>
    ${!mesNuevo && dias.length ? `<h2>Personas por día</h2><div class="card"><div class="bars">${A.porDia.map((v, i) => v === null ? '' : `<div class="bc" title="Día ${i + 1}: ${v}"><i class="${v ? (i + 1 === diaHoy ? 'cur' : '') : 'zero'}" style="height:${Math.max(2, Math.round(v / max * 92))}px"></i><small>${(i + 1) % 5 === 1 || i + 1 === diaHoy ? i + 1 : ''}</small></div>`).join('')}</div>
      <p class="muted small" style="margin-top:8px">${dias.reduce((a, b) => a + b, 0)} entradas en ${MESL[Number(A.mes.slice(5)) - 1]}</p></div>` : ''}`;
  const res = $('#ares');
  const draw = () => {
    const q = norm(S.ui.asisQ);
    if (!q) { res.style.display = 'none'; return; }
    const list = socios().filter(s => s.estado !== 'Baja' && (norm(s.nombre).includes(q) || norm(s.id).includes(q))).slice(0, 8);
    res.style.display = '';
    res.innerHTML = list.length ? list.map(s => {
      const a = asisOf(s);
      return `<div class="li"><div class="av">${esc(initial(s.nombre))}</div><div class="mid"><div class="t">${esc(s.nombre)}</div><div class="s">${esc(s.id)} · ${badge(s.estado)}</div></div>
        <div class="end">${a.hoy ? `<span class="inline-ok">✓ ${esc(a.hoy)}</span>` : `<button class="btn sm" data-in="${s.fila}">Entrada</button>`}</div></div>`;
    }).join('') : '<div class="empty">Sin resultados</div>';
    $$('[data-in]', res).forEach(b => b.onclick = () => { b.disabled = true; b.textContent = '…'; registrarEntrada(socioBy(b.dataset.in)); });
  };
  $('#aq').oninput = e => { S.ui.asisQ = e.target.value; draw(); };
  draw();
  $$('.mid.tap', m).forEach(b => b.onclick = () => openSocio(b.dataset.f));
  $$('a[data-k]', m).forEach(a => a.addEventListener('click', () => { markSent(a.dataset.k); setTimeout(() => render(), 300); }));
  $$('[data-del]', m).forEach(b => b.onclick = async () => {
    const s = socioBy(b.dataset.del);
    if (!(await ask(`¿Quitar la entrada de hoy de ${esc(s.nombre)}?`, 'Quitar'))) return;
    await send('asistencia', { fila: s.fila, id: s.id, borrar: true }, 'Entrada quitada');

        <div class="end"><span><b class="${x.existencia <= 0 ? 'red' : 'gold'}" style="font-size:18px">${x.existencia}</b> <span class="muted small">pzas</span></span>${prodEstado(x)}</div></div>
        <div class="row" style="padding:0 14px 12px;border-bottom:1px solid var(--line)"><button class="btn sm ghost" data-rec="${esc(x.nombre)}">+ Recibí mercancía</button>${isOwner() ? `<button class="btn sm ghost" data-edp="${x.fila}">✏️ Precio / mínimo</button>` : ''}</div>`).join('') : '<div class="empty">Sin productos</div>'}</div>
      <p class="muted small">Aviso de «Pocas piezas» al quedar ${S.d.avisoMinimo} o menos (o el mínimo propio de cada producto).</p>`;
  }
  m.innerHTML = h;
  $$('.seg:not(#vmet) button', m).forEach(b => b.onclick = () => { S.ui.tiendaMode = b.dataset.m; renderTienda(m); });
  if (mode === 'vender') {
    $('#pick').onclick = () => pickSocio(s => { V.socio = s; closeSheet(); renderTienda(m); });
    $$('.prod', m).forEach(b => b.onclick = () => { V.producto = b.dataset.p; renderTienda(m); });
    $('#menos').onclick = () => { V.cant = Math.max(1, V.cant - 1); renderTienda(m); };
    $('#mas').onclick = () => { V.cant = Math.min(99, V.cant + 1); renderTienda(m); };
    $$('#vmet button').forEach(b => b.onclick = () => { V.metodo = b.dataset.v; renderTienda(m); });
    $('#vsave').onclick = async () => {
      if (!V.socio) return toast('Elige al socio', true);
      if (!V.producto) return toast('Elige el producto', true);
      $('#vsave').disabled = true; $('#vsave').textContent = 'Guardando…';
      const r = await send('venta', { venta: { fila: V.socio.fila, id: V.socio.id, producto: V.producto, cantidad: V.cant, metodo: V.metodo } }, r => `Venta registrada · ${money(r.total)} ✅`);
      if (r) { S.ui.venta = { socio: null, producto: '', cant: 1, metodo: 'Efectivo' }; render(); if (r.aviso) setTimeout(() => toast(r.aviso.replace('⚠ ', ''), true), 2700); }
      else renderTienda(m);
    };
  } else {
    $$('[data-rec]', m).forEach(b => b.onclick = () => openRecibir(b.dataset.rec));
    $$('[data-edp]', m).forEach(b => b.onclick = () => openProducto(S.d.productos.find(x => x.fila === Number(b.dataset.edp))));
    const np = $('#np'); if (np) np.onclick = () => openProducto();
  }
}
function openRecibir(nombre) {
  const p = S.d.productos.find(x => x.nombre === nombre); if (!p) return;
  openSheet(`${sheetHead('Recibí mercancía', esc(nombre) + ' · hoy hay ' + p.existencia)}
    <label class="f"><span>¿Cuántas piezas llegaron?</span><input id="rp" inputmode="numeric" placeholder="Ej. 24"></label>
    <p class="muted small" style="margin-bottom:14px">Se suman a «Piezas recibidas» en el Sheet (${p.recibidas} → ${p.recibidas} + lo que escribas).</p>
    <button class="btn" data-save id="rs">Sumar al inventario</button>`, () => {
    $('#rp').focus();
    $('#rs').onclick = async () => {
      const n = parseInt($('#rp').value, 10);
      if (!(n >= 1)) return toast('Escribe cuántas piezas', true);
      const r = await send('recibir', { producto: nombre, piezas: n }, `+${n} ${nombre} en inventario ✅`);
      if (r) closeSheet();
    };
  });
}
function openProducto(p) {
  const nuevo = !p;
  openSheet(`${sheetHead(nuevo ? 'Nuevo producto' : esc(p.nombre), nuevo ? '' : 'El nombre no se cambia para no romper el historial de ventas')}
    ${nuevo ? '<label class="f"><span>Nombre</span><input id="xn" placeholder="Ej. Gatorade" autocapitalize="sentences"></label>' : ''}
    <div class="f-row"><label class="f"><span>Precio de venta</span><input id="xp" inputmode="decimal" value="${nuevo ? '' : p.precio}"></label>
    <label class="f"><span>Mínimo (opcional)</span><input id="xm" inputmode="numeric" value="${nuevo || p.minimo === null ? '' : p.minimo}" placeholder="${S.d.avisoMinimo}"></label></div>
    ${nuevo ? '<label class="f"><span>Piezas que tienes hoy</span><input id="xc" inputmode="numeric" placeholder="0"></label>' : ''}
    <button class="btn" data-save id="xs">${nuevo ? 'Agregar producto' : 'Guardar'}</button>`, () => {
    $('#xs').onclick = async () => {
      const body = { fila: nuevo ? 0 : p.fila, nombre: nuevo ? $('#xn').value.trim() : p.nombre, precio: Number($('#xp').value), minimo: $('#xm').value === '' ? '' : Number($('#xm').value), piezas: nuevo ? Number($('#xc').value || 0) : 0 };
      if (!body.nombre) return toast('Escribe el nombre', true);
      if (!($('#xp').value !== '' && body.precio >= 0)) return toast('Escribe el precio', true);
      const r = await send('producto_guardar', { producto: body }, nuevo ? 'Producto agregado ✅' : 'Guardado ✅');
      if (r) closeSheet();
    };
  });
}

  });

  const porDia = Array.from({ length: 30 }, (_, i) => i + 1 <= t.getDate() ? (i + 1 === t.getDate() ? 4 : (i * 7) % 13) : 0);
  const pagos = socs.filter(s => s.ultimoPago).map((s, i) => ({ fila: 4 + i, fecha: ymd(add(-(i * 2))), socio: s.id + ' - ' + s.nombre, id: s.id, nombre: s.nombre, periodo: 'Mensual', monto: i === 3 ? 300 : s.monto, metodo: METODOS[i % 3], recibio: 'Recepción', notas: '', lista: s.monto, inicia: ymd(add(-(i * 2))), vence: ymd(add(30 - i * 2)) }));
  const productos = [['Agua', 15, 24, 9], ['Monster', 45, 12, 10], ['Sting', 12, 0, 0], ['Proteína RTD', 55, 10, 3]].map(([n, p, r, v], i) => ({ fila: 5 + i, nombre: n, precio: p, recibidas: r, vendidas: v, existencia: r - v, minimo: null, estado: r - v <= 0 ? 'Agotado' : r - v <= 5 ? 'Pocas piezas' : 'OK', acumulado: v * p }));
  const ventas = [{ fila: 5, fecha: ymd(t), socio: 'KG-001 - Ana López', producto: 'Agua', cantidad: 2, precio: 15, total: 30, metodo: 'Efectivo', notas: '' }];
  const meses = Array.from({ length: 12 }, (_, i) => { const d = new Date(t.getFullYear(), t.getMonth() - 11 + i, 1); const v = i < 8 ? 0 : 3000 + i * 900; return { mes: MES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), mensualidades: v, pagos: v / 400 | 0, ventas: i < 8 ? 0 : 150 * i, total: v + (i < 8 ? 0 : 150 * i) }; });

function demoPanel(rol) {

  const p = { activos: act.length, porVencer: c('Por vencer') + c('Vence hoy'), vencidos: c('Vencido'), sinPagos: c('Sin pagos'), bajas: c('Baja'), pagosMes: DB.pagos.filter(x => x.fecha.slice(0, 7) === DB.hoy.slice(0, 7)).length, porMembresia: { Individual: act.filter(s => s.membresia === 'Individual').length, Pareja: act.filter(s => s.membresia === 'Pareja').length, Estudiante: act.filter(s => s.membresia === 'Estudiante').length }, porAgotarse: DB.productos.filter(x => x.estado !== 'OK').length };
  if (rol === 'dueno') {

  }

}
function demoApi(accion, x, pin) {
  return new Promise(res => setTimeout(() => {
    if (!DB) demoInit();
    const rol = pin === '000000' ? 'dueno' : pin === '111111' ? 'recepcion' : null;
    if (!rol) return res({ ok: false, error: 'pin', restantes: 7 });
    const out = r => { const d = JSON.parse(JSON.stringify(DB)); d.rol = rol; d.panel = demoPanel(rol); r.datos = d; res(r); };
    const now = new Date(), hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
    if (accion === 'datos' || accion === 'login') { const d = JSON.parse(JSON.stringify(DB)); d.rol = rol; d.panel = demoPanel(rol); return res(d); }
    if (accion === 'asistencia') {
      const s = DB.socios.find(z => z.fila === x.fila); const a = DB.asistencia.socios[s.id];
      if (x.borrar) { a.hoy = ''; a.dias = Math.max(0, a.dias - 1); return out({ ok: true, borrado: true }); }
      if (a.hoy) return out({ ok: true, ya: true, hora: a.hoy });
      a.hoy = hhmm; a.dias++; a.aviso = ''; a.sinVenir = 0; DB.asistencia.porDia[now.getDate() - 1]++; return out({ ok: true, hora: hhmm });
    }
    if (accion === 'pago') {
      const p = x.pago, s = DB.socios.find(z => z.fila === p.fila); const meses = { Mensual: 1, Trimestral: 3, Semestral: 6, Anual: 12 }[p.periodo];
      const base = s.dias !== null && s.dias >= 0 ? new Date(dmyToYmd(s.vence) + 'T12:00:00') : new Date(p.fecha + 'T12:00:00');
      if (meses) base.setMonth(base.getMonth() + meses); else if (p.periodo === 'Semana') base.setDate(base.getDate() + 7);
      const v = base.toISOString().slice(0, 10);
      DB.pagos.push({ fila: 100 + DB.pagos.length, fecha: p.fecha, socio: s.id + ' - ' + s.nombre, id: s.id, nombre: s.nombre, periodo: p.periodo, monto: p.monto, metodo: p.metodo, recibio: ROL[rol], notas: p.notas, lista: DB.tarifas[s.membresia][p.periodo], inicia: p.fecha, vence: v });
      s.vence = v.split('-').reverse().join('/'); s.ultimoPago = p.fecha.split('-').reverse().join('/'); s.dias = Math.round((new Date(v) - new Date(DB.hoy)) / 864e5); s.estado = s.dias > 1 ? 'Al corriente' : 'Por vencer'; s.url = s.dias > 1 ? s.url : s.url; s.plan = p.periodo === 'Visita' ? s.plan : p.periodo;
      return out({ ok: true, vence: v });
    }
    if (accion === 'socio_guardar') {
      const b = x.socio; const dmy = y => y ? y.split('-').reverse().join('/') : '';
      if (b.fila) { const s = DB.socios.find(z => z.fila === b.fila); Object.assign(s, { nombre: b.nombre, wa: b.wa, membresia: b.membresia, plan: b.plan, inscripcion: dmy(b.inscripcion), nacimiento: dmy(b.nacimiento), correo: b.correo, emergencia: b.emergencia, notas: b.notas }); if (rol === 'dueno' && b.activo) { s.activo = b.activo; if (b.activo === 'No') s.estado = 'Baja'; } return out({ ok: true, fila: s.fila, id: s.id }); }
      const fila = 4 + DB.socios.length, id = 'KG-' + String(DB.socios.length + 1).padStart(3, '0');
      DB.socios.push({ fila, id, nombre: b.nombre.trim(), wa: b.wa, membresia: b.membresia, plan: b.plan, inscripcion: dmy(b.inscripcion || DB.hoy), nacimiento: dmy(b.nacimiento), correo: b.correo, emergencia: b.emergencia, activo: 'Sí', notas: b.notas, monto: DB.tarifas[b.membresia][b.plan], ultimoPago: '', vence: '', dias: null, estado: 'Sin pagos', url: '', graciasVisita: b.plan === 'Visita', graciasNuevo: b.plan !== 'Visita', urlVisita: '', urlNuevo: waLink(b.wa, '¡Qué gusto tenerte en la manada! 🦍') });
      DB.asistencia.socios[id] = { hoy: '', dias: 0, ultima: '', sinVenir: 0, aviso: '' };
      return out({ ok: true, fila, id, nuevo: true });
    }
    if (accion === 'venta') {
      const v = x.venta, s = DB.socios.find(z => z.fila === v.fila), p = DB.productos.find(z => z.nombre === v.producto);
      p.vendidas += v.cantidad; p.existencia -= v.cantidad; p.acumulado += p.precio * v.cantidad; p.estado = p.existencia <= 0 ? 'Agotado' : p.existencia <= 5 ? 'Pocas piezas' : 'OK';
      DB.ventas.push({ fila: 6 + DB.ventas.length, fecha: DB.hoy, socio: s.id + ' - ' + s.nombre, producto: p.nombre, cantidad: v.cantidad, precio: p.precio, total: p.precio * v.cantidad, metodo: v.metodo, notas: '' });
      return out({ ok: true, total: p.precio * v.cantidad, aviso: p.existencia < 0 ? '⚠ Sin piezas suficientes: captura lo recibido en Inventario' : '' });
    }
    if (accion === 'recibir') { const p = DB.productos.find(z => z.nombre === x.producto); p.recibidas += x.piezas; p.existencia += x.piezas; p.estado = p.existencia <= 0 ? 'Agotado' : p.existencia <= 5 ? 'Pocas piezas' : 'OK'; return out({ ok: true }); }
    if (accion === 'producto_guardar') {
      if (rol !== 'dueno') return res({ ok: false, error: 'permiso' });
      const b = x.producto;
      if (b.fila) { const p = DB.productos.find(z => z.fila === b.fila); p.precio = b.precio; p.minimo = b.minimo === '' ? null : b.minimo; return out({ ok: true }); }
      if (DB.productos.some(z => norm(z.nombre) === norm(b.nombre))) return res({ ok: false, error: 'duplicado' });
      DB.productos.push({ fila: 5 + DB.productos.length, nombre: b.nombre, precio: b.precio, recibidas: b.piezas, vendidas: 0, existencia: b.piezas, minimo: b.minimo === '' ? null : b.minimo, estado: b.piezas <= 0 ? 'Agotado' : b.piezas <= 5 ? 'Pocas piezas' : 'OK', acumulado: 0 });
      return out({ ok: true });
    }
    res({ ok: false, error: 'accion' });
  }, 350));
}
